[package]
name = "hibi-nihongo"
version = "0.1.0"
description = "Hibi Nihongo - học tiếng Nhật mỗi ngày"
edition = "2021"

[lib]
name = "hibi_nihongo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# Bản Windows (src/modules/desktop): tự cập nhật, phím tắt tra từ ở mọi app, khay hệ thống,
# chạy cùng Windows, nhớ vị trí cửa sổ, chỉ mở một cửa sổ app
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
