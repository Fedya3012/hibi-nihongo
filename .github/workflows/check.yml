# Kiểm tra code mỗi khi có thay đổi: báo lỗi sớm trước khi phát hành
name: Check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Chạy bộ kiểm tra tự động (lịch ôn FSRS, chia động từ, thêm thẻ không trùng...)
      - run: npm test
      - run: npm run build
      # Build thêm đúng kiểu bản website (GitHub Pages) để lỗi lộ ra trước khi gộp vào main
      - run: npm run build -- --base=./
