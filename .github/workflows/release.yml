# TỰ ĐỘNG BUILD BẢN WINDOWS (.exe) VÀ WEBSITE
# Mỗi khi code mới được đưa vào nhánh main (hoặc khi bạn bấm "Run workflow"), máy chủ GitHub sẽ:
#   1. Build file cài đặt .exe cho Windows và đăng lên mục Releases
#   2. Build website và đăng lên GitHub Pages
# Bạn không cần cài gì trên máy mình.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Nếu có lần build mới khi lần cũ chưa xong, chỉ giữ lần mới nhất
concurrency: { group: release, cancel-in-progress: true }

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # Mỗi lần build có số phiên bản mới (0.1.<số lần chạy>), để app đã cài biết có bản mới mà tự cập nhật.
      # Đẩy tag dạng v1.2.3 thì dùng đúng số đó. Chỉ đổi trong máy build, không sửa file trong repo.
      - name: Đặt số phiên bản
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.${{ github.run_number }}"; fi
          echo "Phiên bản: $V"
          node -e "const fs=require('fs');for(const f of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\\n')}" "$V"
      # Tự cập nhật cần chữ ký số (secret TAURI_SIGNING_PRIVATE_KEY, xem src/modules/desktop/README.md).
      # Chưa có secret thì vẫn build .exe như cũ, chỉ là app chưa tự cập nhật được.
      - name: Bật file tự cập nhật nếu đã có chữ ký
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "TAURI_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else echo "::warning::Chưa có secret TAURI_SIGNING_PRIVATE_KEY nên bản này chưa tự cập nhật được."; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Hibi Nihongo v__VERSION__'
          releaseBody: 'Tải file *-setup.exe bên dưới và mở nó để cài. Đã cài bản có tự cập nhật thì app tự báo khi có bản mới.'
          releaseDraft: false
          args: ${{ env.TAURI_ARGS }}

  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -- --base=./
      - uses: actions/configure-pages@v6
      # Tên gói có số lần chạy: bấm "Re-run" sẽ không bị lỗi "Multiple artifacts named github-pages"
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist, name: 'github-pages-${{ github.run_attempt }}' }
      # Máy chủ GitHub Pages thỉnh thoảng lỗi tạm thời (ví dụ "status: 502").
      # Khi đó đợi 1 phút rồi tự thử đăng lại, không cần bạn bấm gì.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with: { artifact_name: 'github-pages-${{ github.run_attempt }}' }
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with: { artifact_name: 'github-pages-${{ github.run_attempt }}' }

  # Nếu bước đăng website lỗi, ghi hướng dẫn sửa bằng tiếng Việt vào trang kết quả của lần chạy
  web-help:
    needs: web
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Website chưa đăng được

          Nếu trong log có **status: 500/502/503** hoặc chữ *Server error*: đó là lỗi tạm thời
          của máy chủ GitHub, không phải lỗi code. Đợi vài phút rồi bấm **Re-run failed jobs**.

          Nếu không, nguyên nhân hay gặp nhất là cài đặt GitHub Pages:

          1. **Settings → Pages → Source** phải là **GitHub Actions**.
          2. **Settings → Environments → github-pages → Deployment branches and tags**:
             phải có nhánh **main** (hoặc chọn *No restriction*).

          Sửa xong, mở lại lần chạy này và bấm **Re-run failed jobs**.
          MD
